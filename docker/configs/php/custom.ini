; =====================================================
; PHP Custom Configuration for Nextcloud
; Optimized for 60TB storage with large file uploads
; =====================================================

; -----------------------------------------------------
; Memory Settings
; -----------------------------------------------------
memory_limit = 1024M

; -----------------------------------------------------
; Upload Settings (Large Files)
; -----------------------------------------------------
upload_max_filesize = 16G
post_max_size = 16G
max_input_time = 3600
max_execution_time = 3600

; -----------------------------------------------------
; OPcache Settings (Performance)
; -----------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.save_comments = 1
opcache.jit = 1255
opcache.jit_buffer_size = 128M

; -----------------------------------------------------
; APCu Settings (Local Cache)
; -----------------------------------------------------
apc.enabled = 1
apc.shm_size = 128M
apc.ttl = 7200
apc.enable_cli = 1

; -----------------------------------------------------
; Session Settings
; -----------------------------------------------------
session.save_handler = redis
session.save_path = "tcp://redis:6379?auth=${REDIS_PASSWORD}"
session.gc_maxlifetime = 86400

; -----------------------------------------------------
; Error Handling
; -----------------------------------------------------
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------------------------------------
; Security Settings
; -----------------------------------------------------
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; -----------------------------------------------------
; Performance Tweaks
; -----------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600
output_buffering = Off
