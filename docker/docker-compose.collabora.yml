# Collabora Online (Office) Docker Compose Override
# 
# LibreOffice tabanlı online ofis paketi
# Word, Excel, PowerPoint dosyalarını tarayıcıda düzenleme
#
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.collabora.yml up -d
#
# Nextcloud'da etkinleştirme:
#   1. Admin → Apps → Office & text → "Nextcloud Office" yükle
#   2. Admin → Administration Settings → Nextcloud Office
#   3. "Use your own server" seç
#   4. URL: https://office.yourdomain.com (NPM üzerinden)
#
# WOPI Protokolü:
#   - Nextcloud, Collabora'ya dosyaları WOPI üzerinden sunar
#   - Collabora, WOPI host listesindeki domain'lerden gelen istekleri kabul eder
#   - NPM arkasında çalışırken aliasgroup ayarları kritiktir

services:
  # ===========================================
  # COLLABORA ONLINE (CODE)
  # ===========================================
  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    environment:
      # =========================================
      # WOPI Host Yapılandırması (Kritik!)
      # =========================================
      # aliasgroup1: Collabora'nın WOPI isteklerini kabul edeceği Nextcloud URL'leri
      # Örnek: Nextcloud https://cloud.example.com adresindeyse
      # COLLABORA_WOPI_URL=https://cloud.example.com:443
      - aliasgroup1=${COLLABORA_WOPI_URL:?COLLABORA_WOPI_URL gerekli - .env dosyasını kontrol edin}
      
      # =========================================
      # Server Yapılandırması
      # =========================================
      # server_name: Collabora'nın kendi public URL'i (NPM üzerinden)
      # Örnek: office.example.com
      - server_name=${COLLABORA_SERVER_NAME:?COLLABORA_SERVER_NAME gerekli - .env dosyasını kontrol edin}
      
      # =========================================
      # SSL Ayarları (NPM arkasında)
      # =========================================
      # SSL'i devre dışı bırak - NPM SSL termination yapacak
      # ssl.termination=true: Collabora'ya gelen isteklerin proxy'den geldiğini belirtir
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:net.proto=IPv4 --o:logging.level=warning --o:num_prespawn_children=2
      
      # =========================================
      # Admin Console
      # =========================================
      - username=${COLLABORA_ADMIN_USER:-admin}
      - password=${COLLABORA_ADMIN_PASSWORD:-}
      
      # =========================================
      # Lokalizasyon
      # =========================================
      - dictionaries=tr_TR,en_US,de_DE,fr_FR
      
    ports:
      # Internal port - NPM üzerinden proxy yapılacak
      # Production'da bu portu dışarıya açmayın, sadece NPM erişsin
      - "${COLLABORA_PORT:-9980}:9980"
    volumes:
      # Font desteği (opsiyonel - özel fontlar için)
      - collabora-fonts:/opt/collabora/share/fonts/truetype/local:ro
    networks:
      - nextcloud-network
    cap_add:
      - MKNOD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9980/hosting/discovery"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  collabora-fonts:
    driver: local
