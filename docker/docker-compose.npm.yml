# Nginx Proxy Manager (NPM) Docker Compose Override
# 
# Bu dosyayı kullanmak için:
# 1. docker-compose.npm.yml olarak kopyalayın
# 2. .env dosyasında NGINX_HTTP_PORT=8080 yapın
# 3. Çalıştırın: docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d
#
# NPM Admin Panel: http://your-server:81
# Default login: admin@example.com / changeme

services:
  # ===========================================
  # NGINX PROXY MANAGER
  # ===========================================
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"      # HTTP
      - "${NPM_HTTPS_PORT:-443}:443"   # HTTPS
      - "${NPM_ADMIN_PORT:-81}:81"     # Admin panel
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    environment:
      - TZ=${TIMEZONE:-Europe/Istanbul}
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  npm-data:
    driver: local
  npm-letsencrypt:
    driver: local
