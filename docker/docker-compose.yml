# Nextcloud + TrueNAS Docker Compose
# 60TB Self-Hosted Cloud Storage Solution
# SSL is optional - use Nginx Proxy Manager for external access
# 
# Configuration is loaded from .env file
# Run: ./setup.sh to generate configuration

services:
  # ===========================================
  # NGINX REVERSE PROXY (HTTP only)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./configs/nginx/nextcloud.conf:/etc/nginx/conf.d/default.conf:ro
      - nextcloud-app:/var/www/html:ro
    depends_on:
      - nextcloud
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # NEXTCLOUD APPLICATION
  # ===========================================
  nextcloud:
    image: nextcloud:${NEXTCLOUD_TAG:-29-fpm-alpine}
    container_name: nextcloud
    restart: unless-stopped
    environment:
      # Database
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD:-}
      
      # Admin
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD is required}
      
      # Trusted domains
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      
      # PHP settings
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-1024M}
      - PHP_UPLOAD_LIMIT=${PHP_UPLOAD_LIMIT:-16G}
    volumes:
      # Nextcloud config (NFS from TrueNAS)
      - ${NFS_CONFIG_MOUNT:-/mnt/nextcloud/config}:/var/www/html/config
      
      # User data (NFS from TrueNAS - 60TB)
      - ${NFS_DATA_MOUNT:-/mnt/nextcloud/data}:/var/www/html/data
      
      # App files (local for performance)
      - nextcloud-app:/var/www/html
      
      # Custom PHP config
      - ./configs/php/custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # POSTGRESQL DATABASE (NFS from TrueNAS)
  # ===========================================
  postgres:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      # Database storage (NFS from TrueNAS)
      - ${NFS_DATABASE_MOUNT:-/mnt/nextcloud/database}:/var/lib/postgresql/data
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PostgreSQL performance tuning for Nextcloud (60TB data)
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=128MB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=200
      -c log_min_duration_statement=1000
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8

  # ===========================================
  # REDIS CACHE
  # ===========================================
  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - ./redis-data:/data
    networks:
      - nextcloud-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # CRON (Background Jobs)
  # ===========================================
  cron:
    image: nextcloud:${NEXTCLOUD_TAG:-29-fpm-alpine}
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER:-nextcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ${NFS_CONFIG_MOUNT:-/mnt/nextcloud/config}:/var/www/html/config
      - ${NFS_DATA_MOUNT:-/mnt/nextcloud/data}:/var/www/html/data
      - nextcloud-app:/var/www/html
    depends_on:
      - nextcloud
    networks:
      - nextcloud-network

# ===========================================
# NETWORKS
# ===========================================
networks:
  nextcloud-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===========================================
# VOLUMES
# ===========================================
volumes:
  nextcloud-app:
    driver: local
